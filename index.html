<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruthOracle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:2rem}
h1{color:#ff6b35;margin-bottom:1rem}
.card{background:#1a1a1a;border-radius:8px;padding:1rem;margin-bottom:1rem;border:1px solid #333}
input,textarea{width:100%;padding:.5rem;margin-bottom:.5rem;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:4px}
button{background:#ff6b35;color:#fff;border:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer;margin-right:.5rem;margin-bottom:.5rem}
button:hover{opacity:.8}
button:disabled{opacity:.5}
.msg{padding:.5rem;border-radius:4px;margin-top:.5rem;font-size:.9rem}
.msg.ok{background:#1a3a1a;color:#7fff7f}
.msg.err{background:#3a1a1a;color:#ff7f7f}
.msg.info{background:#1a1a3a;color:#7f7fff}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{padding:.5rem 1rem;background:#1a1a1a;border:1px solid #333;border-radius:4px;cursor:pointer}
.tab.active{background:#ff6b35}
.section{display:none}
.section.active{display:block}
#log{position:fixed;bottom:0;right:0;background:#222;color:#0f0;padding:.5rem;font-size:11px;max-width:300px;max-height:150px;overflow:auto;display:none}
</style>
</head>
<body>

<h1>TruthOracle</h1>
<p style="color:#888;margin-bottom:1rem">Decentralized Fact Verification with AI Consensus</p>

<div style="text-align:right;margin-bottom:1rem">
  <button id="cBtn" onclick="connect()">Connect Wallet</button>
  <span id="addr" style="font-size:.85rem;color:#888"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="go('s')">Submit</div>
  <div class="tab" onclick="go('c')">Claims</div>
  <div class="tab" onclick="go('a')">About</div>
</div>

<div id="s" class="section active">
  <div class="card">
    <h3>Submit a Claim</h3>
    <input type="text" id="cid" placeholder="Claim ID">
    <textarea id="ctxt" rows="2" placeholder="Your claim"></textarea>
    <button onclick="submit()">Submit Claim</button>
    <div id="ss"></div>
  </div>
  <div class="card">
    <h3>Resolve Claim</h3>
    <input type="text" id="rid" placeholder="Claim ID">
    <button onclick="resolve()">Resolve</button>
    <div id="rs"></div>
    <div id="vr"></div>
  </div>
</div>

<div id="c" class="section">
  <div class="card">
    <h3>All Claims</h3>
    <button onclick="load()">Refresh</button>
    <div id="cl" style="margin-top:.5rem"></div>
  </div>
</div>

<div id="a" class="section">
  <div class="card">
    <h3>About</h3>
    <p style="color:#ccc;line-height:1.6">
      TruthOracle is a decentralized fact verification protocol built on GenLayer.
      Contract: <code>0x0067D61d2b1992f9bC74e8d43d96dF98C5fccaf2</code>
    </p>
  </div>
</div>

<div id="log"></div>

<script>
var CONTRACT = '0x0067D61d2b1992f9bC74e8d43d96dF98C5fccaf2';
var acct = null;
var logEl = document.getElementById('log');

function L(m) {
  console.log(m);
  if (logEl) { logEl.style.display = 'block'; logEl.innerHTML += m + '<br>'; }
}

L('page loaded');
L('ethereum: ' + (window.ethereum ? 'YES' : 'NO'));
L('rabby: ' + (window.rabby ? 'YES' : 'NO'));

function prov() {
  if (window.ethereum) return window.ethereum;
  return null;
}

function connect() {
  L('connect clicked');
  var p = prov();
  if (!p) { msg('ss', 'No wallet detected', 'err'); return; }
  L('requesting accounts...');
  p.request({ method: 'eth_requestAccounts' }).then(function(a) {
    L('got: ' + JSON.stringify(a));
    if (!a || !a.length) { msg('ss', 'No accounts', 'err'); return; }
    acct = a[0];
    document.getElementById('addr').textContent = acct.slice(0,6)+'...'+acct.slice(-4);
    document.getElementById('cBtn').textContent = 'Connected';
    msg('ss', 'Connected: ' + acct.slice(0,6), 'ok');
  }).catch(function(e) { L('err: ' + e.message); msg('ss', 'Error: ' + e.message, 'err'); });
}

function submit() {
  if (!acct) { msg('ss', 'Connect wallet first', 'err'); return; }
  var id = document.getElementById('cid').value;
  var txt = document.getElementById('ctxt').value;
  if (!id || !txt) { msg('ss', 'Fill all fields', 'err'); return; }
  msg('ss', 'Submitting...', 'info');
  var p = prov();
  var sel = '0x4f6e982b';
  var data = sel + enc(id) + enc(txt);
  p.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data: data, value: '0x0' }] })
   .then(function(tx) { msg('ss', 'Submitted! ' + tx.slice(0,20), 'ok'); })
   .catch(function(e) { msg('ss', 'Error: ' + e.message, 'err'); });
}

function resolve() {
  if (!acct) { msg('rs', 'Connect wallet first', 'err'); return; }
  var id = document.getElementById('rid').value;
  if (!id) { msg('rs', 'Enter claim ID', 'err'); return; }
  msg('rs', 'Resolving...', 'info');
  var p = prov();
  var sel = '0x3d18d4d8';
  var data = sel + enc(id);
  p.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data: data, value: '0x0' }] })
   .then(function(tx) { msg('rs', 'Resolved! ' + tx.slice(0,20), 'ok'); })
   .catch(function(e) { msg('rs', 'Error: ' + e.message, 'err'); });
}

function load() {
  if (!acct) { document.getElementById('cl').innerHTML = '<p style="color:#ff7f7f">Connect wallet first</p>'; return; }
  var p = prov();
  p.request({ method: 'eth_call', params: [{ from: acct, to: CONTRACT, data: '0x2e4a6e1a' }, 'latest'] })
   .then(function(r) { document.getElementById('cl').innerHTML = '<p style="color:#888">Total: ' + parseInt(r,16) + '</p>'; })
   .catch(function(e) { document.getElementById('cl').innerHTML = '<p style="color:#ff7f7f">Error</p>'; });
}

function enc(s) {
  var h = '';
  for (var i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(2,'0');
  return (h.length/2).toString(16).padStart(64,'0') + h.padEnd(64,'0');
}

function msg(id, t, c) {
  document.getElementById(id).innerHTML = '<div class="msg ' + c + '">' + t + '</div>';
}

function go(s) {
  L('go ' + s);
  var tabs = document.querySelectorAll('.tab');
  var secs = document.querySelectorAll('.section');
  for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tab';
  for (var i = 0; i < secs.length; i++) secs[i].className = 'section';
  if (s === 's') tabs[0].className = 'tab active';
  if (s === 'c') tabs[1].className = 'tab active';
  if (s === 'a') tabs[2].className = 'tab active';
  document.getElementById(s).className = 'section active';
}
</script>
</body>
</html>
